[package]
name = "riffq"
version = "0.3.0"
edition = "2024"

[lib]
name = "_riffq"
crate-type = ["cdylib"]

[profile.fast]
inherits = "dev"
opt-level = 1
debug = false
overflow-checks = false
incremental = true
codegen-units = 4

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "chrono"] }

pgwire = "0.40.0"
# pgwire = { git = "https://github.com/ybrs/pgwire", branch = "expose-sni", package = "pgwire" }

bytes = "1.5"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
hex = "0.4.3"
postgres-types = { version = "0.2", features = ["with-chrono-0_4"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"
arrow = { version = "58.0.0", features = ["ffi", "canonical_extension_types"] }
sqlparser = "0.62"


chrono = "0.4.41"
log = "0.4"
datafusion = "54.0.0"
# TEMPORARY (local development): build against the local pg_catalog checkout so
# fixes can be tested before they are pushed. Restore the git rev dependency
# below after the pg_catalog changes are committed/pushed and pick the new rev.
datafusion_pg_catalog = { path = "../pg_catalog", package = "datafusion_pg_catalog" }
# datafusion_pg_catalog = { git = "https://github.com/ybrs/pg_catalog", rev = "984e4962e977058fba33516e69e89a347683afcf", package = "datafusion_pg_catalog" }

env_logger = "0.11.8"


arrow-schema  = { version = "58.0.0" }
